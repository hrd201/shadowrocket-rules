[Script]
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/(youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch))(\?(.*))?$,requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/Maasea/sgmodule/26871a1f7b984fa1df39a05b5037898035987239/Script/Youtube/youtube.response.js
redfruit.ad.response = type=http-response,pattern=^https:\/\/(api-access\.pangolin-sdk-toutiao(?:-b|[1-5])?\.com|is\.snssdk\.com)\/api\/ad\/union\/sdk(?:\/.*)?(?:\?.*)?$,requires-body=1,max-size=-1,script-path=https://raw.githubusercontent.com/hrd201/shadowrocket-rules/31726891f2551fd1addd91e2a9ac83eb90d160d2/scripts/redfruit-ad-response.js

[Map Local]
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

[MITM]
enable = true
hostname = %APPEND% *.googlevideo.com, youtubei.googleapis.com, api-access.pangolin-sdk-toutiao.com, api-access.pangolin-sdk-toutiao-b.com, api-access.pangolin-sdk-toutiao1.com, api-access.pangolin-sdk-toutiao2.com, is.snssdk.com
